[project]
name = "layamcp"
version = "0.1.0"
description = "HTTP MCP server wrapping the Laya decision engine for Pi and other MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gene Gulanes Jr." },
]
keywords = ["mcp", "laya", "decision-engine", "pi", "ai-agent", "guardrail", "triage"]

dependencies = [
    "laya>=0.3.21",
    "huggingface-hub>=0.24",
    "packaging>=23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp[server]<2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[project.scripts]
layamcp = "laya_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laya_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]