[project]
name = "decisionmcp"
version = "0.3.0"
description = "Engine-agnostic HTTP MCP server for decision-model inference (default engine: Laya), for Pi and other MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gene Gulanes Jr." },
]
keywords = ["mcp", "decision-engine", "laya", "pi", "ai-agent", "guardrail", "triage"]

dependencies = [
    "huggingface-hub>=0.24",
    "packaging>=23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.9,<2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
# Heavy default engine (pulls torch/transformers). Only needed to actually
# serve; the mocked test suite and tool development run without it.
laya = ["laya>=0.3.21"]
# Alternative engine: LiquidAI d1-3B served directly through transformers
# (https://huggingface.co/LiquidAI/d1-3B). Requires transformers>=5.14 for
# the checkpoint's shipped modeling code (trust_remote_code).
d1 = [
    "transformers>=5.14",
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=10",
]
# Alternative engine: LiquidAI d1-omni-600M as an 8-bit MLX export
# (https://huggingface.co/LiquidAI/d1-omni-600M-MLX-8bit). Apple Silicon only;
# mlx-vlm 0.7.8 is the first release with d1 support.
d1-omni = [
    "mlx-vlm>=0.7.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Alternative engine: LiquidAI d1-omni-600M served through transformers
# (https://huggingface.co/LiquidAI/d1-omni-600M) — the cross-platform twin of
# the MLX export (CUDA/CPU, e.g. Windows). Vision-capable: the video tools
# attach base64 JPEG frames via system_one(images=...).
d1-omni-tf = [
    "transformers>=5.14",
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[project.scripts]
decisionmcp = "decision_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decision_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
