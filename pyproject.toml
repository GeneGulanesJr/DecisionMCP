[project]
name = "decisionmcp"
version = "0.2.0"
description = "Engine-agnostic HTTP MCP server for decision-model inference (default engine: Laya), for Pi and other MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gene Gulanes Jr." },
]
keywords = ["mcp", "decision-engine", "laya", "pi", "ai-agent", "guardrail", "triage"]

dependencies = [
    "huggingface-hub>=0.24",
    "packaging>=23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.9,<2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
# Heavy default engine (pulls torch/transformers). Only needed to actually
# serve; the mocked test suite and tool development run without it.
laya = ["laya>=0.3.21"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[project.scripts]
decisionmcp = "decision_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decision_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
